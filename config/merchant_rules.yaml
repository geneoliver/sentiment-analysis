# Tier-1 rule-based categorization.
#
# Each rule matches when `keyword` appears anywhere in the transaction
# description (case-insensitive substring match). If more than one rule
# matches, the longest keyword wins (so a more specific rule beats a more
# generic one).
#
# This is a small illustrative starter set — replace/extend it with your
# own recurring merchants and known transactions. Category/subcategory
# values must exist in config/taxonomy.yaml.
#
# This file is yours to hand-edit. Rules the pipeline learns automatically
# from repeated corrections are written to config/learned_rules.yaml instead,
# so your own edits here never get overwritten by automation.

rules:
  # --- Internal transfers (excluded from spend summaries) ---
  - keyword: "AMEX EPAYMENT"
    category: internal_transfer
    subcategory: "Credit Card Payment"
  - keyword: "AUTOPAY PAYMENT RECEIVED"
    category: internal_transfer
    subcategory: "Credit Card Payment"

